<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thu tiền tháng 10 - Lớp 6A</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d32f2f; }
        .input-group { margin: 15px 0; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .qr-box { margin-top: 20px; padding: 15px; border: 2px dashed #d32f2f; border-radius: 10px; }
        .qr-box img { max-width: 100%; height: auto; }
        .btn { background: #d32f2f; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin-top: 15px; }
        .btn:hover { background: #b71c1c; }
        .info { background: #fff3f3; padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 14px; color: #333; }
        .highlight { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>THU CÁC KHOẢN THÁNG 10 - LỚP 6A</h2>
    <p>GVCN: Hoàng Anh Dũng - MB Bank</p>

    <div class="input-group">
        <label>Họ và tên học sinh:</label>
        <input type="text" id="studentName" placeholder="Ví dụ: Nguyễn Văn A" oninput="updateQR()">
    </div>

    <div class="input-group">
        <label>Hình thức đi học:</label>
        <select id="transport" onchange="updateQR()">
            <option value="202000">Không đi xe (202.000đ)</option>
            <option value="242000">Có đi xe đạp (242.000đ)</option>
        </select>
    </div>

    <div class="qr-box" id="qrBox">
        <p>Vui lòng nhập tên học sinh để tạo mã QR</p>
    </div>

    <div class="info">
        <b>Số tài khoản:</b> 9704 2292 0513 1639 674<br>
        <b>Ngân hàng:</b> MB Bank<br>
        <b>Nội dung CK:</b> <span id="contentCK" class="highlight">Tên học sinh - Lớp 6A</span>
    </div>
</div>

<script>
    function updateQR() {
        const name = document.getElementById('studentName').value.trim();
        const amount = document.getElementById('transport').value;
        const qrBox = document.getElementById('qrBox');
        const contentSpan = document.getElementById('contentCK');

        if (name === "") {
            qrBox.innerHTML = "<p>Vui lòng nhập tên học sinh để tạo mã QR</p>";
            contentSpan.innerText = "Tên học sinh - Lớp 6A";
            return;
        }

        // Nội dung chuyển khoản: Tên HS + Lớp 6A
        const content = encodeURIComponent(name + " - Lop 6A"); 
        contentSpan.innerText = decodeURIComponent(content);

        // Tạo link ảnh VietQR động
        const bankId = "MB"; 
        const accountNo = "9704229205131639674";
        const qrUrl = `https://img.vietqr.io/image/${bankId}-${accountNo}-compact2.png?amount=${amount}&addInfo=${content}&accountName=HOANG%20ANH%20DUNG`;

        qrBox.innerHTML = `<img src="${qrUrl}" alt="Mã QR thanh toán">`;
    }
</script>

</body>
</html>
